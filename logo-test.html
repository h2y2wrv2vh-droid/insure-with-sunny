<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Strip Test – Insure With Sunny</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .test-note{background:#0f2a4a;color:#fff;text-align:center;padding:10px;font-size:.85rem}
    /* Logo tiles: uniform optical height, grayscale until hover */
    .logo-tile{flex-shrink:0;margin-right:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 22px;display:flex;align-items:center;justify-content:center;height:78px;box-sizing:border-box}
    .logo-tile img{height:46px;width:auto;max-width:160px;object-fit:contain;filter:grayscale(1);opacity:.72;transition:filter .3s ease,opacity .3s ease}
    .logo-tile:hover img{filter:grayscale(0);opacity:1}
    @media (prefers-reduced-motion:reduce){.logo-tile{margin-bottom:14px}}
  </style>
</head>
<body>
  <div class="test-note">TEST PAGE — logo strip preview (not linked from site navigation)</div>

  <section class="markets" aria-label="Insurance companies we work with">
    <div class="container">
      <p class="markets-eyebrow">Our Insurance Markets</p>
    </div>
    <div class="marquee">
      <div class="marquee-track">
        <span class="logo-tile"><img src="/images/logos/aviva.svg" alt="Aviva" loading="lazy"></span>
        <span class="logo-tile"><img src="/images/logos/intact.svg" alt="Intact" loading="lazy"></span>
        <span class="logo-tile"><img src="/images/logos/economical.svg" alt="Economical" loading="lazy"></span>
        <span class="logo-tile"><img src="/images/logos/pembridge.svg" alt="Pembridge" loading="lazy"></span>
        <span class="logo-tile"><img src="/images/logos/chubb.svg" alt="Chubb" loading="lazy"></span>
        <span class="logo-tile"><img src="/images/logos/aig.svg" alt="AIG" loading="lazy"></span>
        <span class="logo-tile"><img src="/images/logos/beacon.svg" alt="Beacon" loading="lazy"></span>
        <span class="logo-tile"><img src="/images/logos/wawanesa.svg" alt="Wawanesa" loading="lazy"></span>
        <span class="logo-tile" aria-hidden="true"><img src="/images/logos/aviva.svg" alt="" loading="lazy"></span>
        <span class="logo-tile" aria-hidden="true"><img src="/images/logos/intact.svg" alt="" loading="lazy"></span>
        <span class="logo-tile" aria-hidden="true"><img src="/images/logos/economical.svg" alt="" loading="lazy"></span>
        <span class="logo-tile" aria-hidden="true"><img src="/images/logos/pembridge.svg" alt="" loading="lazy"></span>
        <span class="logo-tile" aria-hidden="true"><img src="/images/logos/chubb.svg" alt="" loading="lazy"></span>
        <span class="logo-tile" aria-hidden="true"><img src="/images/logos/aig.svg" alt="" loading="lazy"></span>
        <span class="logo-tile" aria-hidden="true"><img src="/images/logos/beacon.svg" alt="" loading="lazy"></span>
        <span class="logo-tile" aria-hidden="true"><img src="/images/logos/wawanesa.svg" alt="" loading="lazy"></span>
      </div>
    </div>
  </section>

  <div class="container" style="padding:40px 20px;max-width:720px">
    <p style="color:var(--muted)">Test strip with 8 real insurer logos. Logos render in grayscale and switch to full colour on hover. The full version will carry all 32 companies.</p>
  </div>
</body>
</html>
